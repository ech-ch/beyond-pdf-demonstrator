# Build des Demonstrators (MVP-Spezifikation 4.1, 4.2, 8 AP2; E16, E17, E22).
#
#   build    Prüfen (Quelle) -> Rendern (alle Formate in EINEM Aufruf) ->
#            Prüfen (Ausgabe) -> Word nachbearbeiten -> Artefakt «website»
#   pages    Veröffentlichen auf GitHub Pages, nur von main und nur, wenn
#            build erfolgreich war. AUSGESCHALTET, bis die Freigabe zum
#            Veröffentlichen vorliegt (E23, AP0a). Einschalten (ca. 15 Min.):
#              1. Repo öffentlich schalten (Gratis-Plan: Pages nur öffentlich)
#              2. Settings -> Pages -> Source: «GitHub Actions»
#              3. Settings -> Secrets and variables -> Actions -> Variables:
#                 PAGES_AKTIV = true
#   release  Bei einem Tag v* ein GitHub-Release mit dem Word (E22)

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.10.19"   # festgelegt (E16); lokal dieselbe Version
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Quarto einrichten
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Versionen
        run: |
          quarto --version
          python --version

      # Prüfungen nach MVP-Spezifikation 3.7 (AP7, tools/pruefe.toml): IDs,
      # Kennzeichnungen, Nummern von Hand, bezug; bricht vor dem Rendern ab.
      - name: Prüfen (Quelle)
        run: python tools/pruefe.py quelle

      # Auswertung der Feedback-Issues, auch mit bösartigen Eingaben (E38)
      - name: Feedback-Auswertung testen
        run: node --test .github/scripts/feedback-label.test.js

      # Alle Formate in einem Aufruf: `quarto render --to X` löscht im
      # Website-Projekt die übrigen Formate (Spike S1). Das Log braucht die
      # Prüfung der Ausgabe (Warnung «Unable to resolve crossref», K3).
      - name: Rendern
        run: |
          set -o pipefail
          quarto render 2>&1 | tee render.log

      # Zählung 36/11/8, Textvergleich mit original/text/ (E19), keine
      # unaufgelösten Verweise (K3), in HTML und Word.
      - name: Prüfen (Ausgabe)
        run: python tools/pruefe.py ausgabe --log render.log

      # Word füllt Inhaltsverzeichnis und Felder beim Öffnen (E17).
      - name: Word nachbearbeiten
        run: find _site -name '*.docx' -print0 | xargs -0 --no-run-if-empty python tools/aktualisiere_felder_beim_oeffnen.py

      - name: Ausgabe als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: _site
          retention-days: 30

      - name: Pages-Artefakt
        if: vars.PAGES_AKTIV == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: build
    if: vars.PAGES_AKTIV == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Artefakt holen
        uses: actions/download-artifact@v4
        with:
          name: website
          path: website

      # Wird das Release von Hand auf GitHub angelegt, entsteht der Tag mit dem
      # Release, und dieser Lauf findet es schon vor. Dann bleiben Titel und
      # Text, und nur die Dateien werden angehängt (--clobber ersetzt sie bei
      # einem erneuten Lauf). Wird nur der Tag gepusht, legt der Lauf das
      # Release selbst an (E44).
      - name: Release erstellen oder Dateien anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dateien=$(find website -name '*.docx' -o -name 'bausteine.json')
          if [ -z "$dateien" ]; then
            echo "Keine Dateien für das Release gefunden." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" $dateien --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" $dateien \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Demonstrator, kein offizieller eCH-Standard. Stand ${GITHUB_REF_NAME} (Commit ${GITHUB_SHA::7})."
          fi
