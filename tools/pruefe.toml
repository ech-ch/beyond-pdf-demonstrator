# Konfiguration für tools/pruefe.py (AP7, MVP-Spezifikation 3.7). Pfade ab Projektordner.

[[standard]]
name = "eCH-0003 V11.1.0 (de)"
quelle = "ech-0003/v11.1.0/de"                       # Gerüst index.qmd und bausteine/
metadaten = "ech-0003/v11.1.0/_metadata.yml"
id_praefix = "ech-0003-bb-"                          # R1
kennzeichnungen = ["MUSS", "SOLLTE", "DARF NICHT"]   # V4, Vokabular von V11.1.0
inhaltsverzeichnis = "original/text/inhaltsverzeichnis.tsv"
html = "_site/ech-0003/v11.1.0/de/index.html"
docx = "_site/ech-0003/v11.1.0/de/DEMO_eCH-0003_V11.1.0_de.docx"
# Elemente der Website, die nicht zum Text gehören (Platzhalter, Bedienelemente
# des Feedbacks). pruefe.py prüft, dass die Ausnahme wirkt.
html_ignorieren = ["platzhalter-hinweis", "baustein-bedienung", "vorlagentext-hinweis"]
# Registry (filters/ech_registry.lua) und Daten von Anhang A
registry = "_site/ech-0003/v11.1.0/bausteine.json"
# Übersichtsseite «Beziehungen» (AP21): liest die Registry der Standardseite und
# muss deshalb in der render-Liste von _quarto.yml nach ihr stehen
beziehungen_quelle = "ech-0003/v11.1.0/de/beziehungen.qmd"
beziehungen = "_site/ech-0003/v11.1.0/de/beziehungen.html"
# Steckbrief (AP24, E51): Angaben und Raster (Vokabular) in der Quelle; die
# Seite liest die Registry wie «Beziehungen» und steht deshalb auch danach
steckbrief_daten = "ech-0003/v11.1.0/steckbrief.yml"
steckbrief_raster = "vorlage/steckbrief"            # <fassung>/raster.yml
steckbrief_quelle = "ech-0003/v11.1.0/de/steckbrief.qmd"
steckbrief = "_site/ech-0003/v11.1.0/de/steckbrief.html"
steckbrief_json = "_site/ech-0003/v11.1.0/steckbrief.json"
referenzen = "ech-0003/v11.1.0/referenzen.yml"
# Ziel der Feedback-Links (filters/ech_feedback.lua)
feedback_repo = "https://github.com/ech-ch/beyond-pdf-demonstrator"

# Überführte Kapitel: gerenderter Klartext = Rohtext (E19), Zählung (D4).
# Ein Kapitel reicht vom Anker `von` bis vor den Anker `bis`, ohne `bis` bis zum
# Ende des Dokuments. «einleitung» und «standard» (Kap. 1 und 2) sind
# provisorische Anker (E05); der Rohtext des ersten Teils umfasst auch die
# Überschrift «1 Einleitung». Abschnitte mit Unterabschnitten (1.3) reichen nur
# bis zum ersten Unterabschnitt.
# `vorlagentext = true`: kein Baustein, kein Feedback, Hinweis auf der Website.
[[standard.kapitel]]
name = "1 Einleitung bis 1.2.1"
von = "einleitung"
bis = "sec-prozessmodule"
rohtext = "original/text/kap01-1.1-bis-1.2.1.txt"

# 1.3 und 1.4 (AP25, E52): mit Abbildung 1 und 2; der Rohtext enthält die
