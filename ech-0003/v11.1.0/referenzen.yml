# Anhang A – Referenzen & Bibliographie von eCH-0003 V11.1.0 (E15).
#
# Daten, keine Bausteine. Je Eintrag:
#   schluessel  für Zitate im Text, z.B. «Semantic Versioning»[@SemVer]
#   kuerzel     Anzeige-Kürzel wie in der linken Spalte des Originals
#   text        wörtlich aus original/text/anhang-a.txt (Seite 34), Markdown;
#               der Link auf semver.org steht auch im Original
# Zitate löst filters/ech_referenzen.lua auf; die Tabelle in Anhang A erzeugt
# der Shortcode {{< referenzen >}} (filters/ech_shortcodes.lua).

referenzen:
  - schluessel: ISO
    kuerzel: "[ISO]"
    text: "Standardisation and related activities – General vocabulary. ISO/IEC Guide 2 : 1996. Trilingual version EN 45020 : 1998."
  - schluessel: eCH-0150
    kuerzel: "eCH-0150"
    text: "eCH-0150: Change und Releasemanagement von eCH-Standards, Version 1.0"
  - schluessel: SemVer
    kuerzel: "SemVer"
    text: "Semantic Versioning (<https://semver.org/>)"
