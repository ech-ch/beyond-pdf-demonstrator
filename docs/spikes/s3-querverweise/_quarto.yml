project:
  type: default
  output-dir: _out
  render:
    - geruest.qmd
    - geruest-ohne-filter.qmd
    - geruest-wordnummern.qmd

lang: de
number-sections: true

bibliography: references.yaml
csl: din_1505_2_alphanumeric.csl
link-citations: true

filters:
  - filters/ech_anhang.lua      # pre-quarto: @sec-anhang-x -> «Anhang X»
  - quarto
  - filters/ech_titelref.lua    # post-quarto: [@sec-x]{.mit-titel} -> «Kapitel 7.1 Titel»
  - filters/ech_docx_nummern.lua  # post-quarto, nur DOCX + docx-nummern: word
  - filters/ech_citations.lua   # FOAG: @key im Fliesstext ohne Klammern

format:
  html:
    toc: true
  docx:
    toc: true
    reference-doc: vorlage/ech-vorlage.docx
