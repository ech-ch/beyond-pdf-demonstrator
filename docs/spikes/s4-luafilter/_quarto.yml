project:
  type: default
  output-dir: _out
  render:
    - geruest.qmd
    - geruest-im-titel.qmd

lang: de
number-sections: true

filters:
  - filters/debug_pre.lua     # protokolliert Attribute VOR quarto
  - quarto
  - filters/debug_post.lua    # protokolliert Attribute NACH quarto
  - filters/feedback.lua      # Feedback-Links (nur HTML), hier NACH quarto

format:
  html:
    toc: true
  docx:
    toc: true
    reference-doc: vorlage/ech-vorlage.docx
